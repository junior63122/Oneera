<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Prototype ONEERA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Studio desk around a phone: left = live phone, right = scenario panel. Dashboard takes the full width. */
:root{
  --pri:#4F6BF5; --pri2:#6E8BF7; --pri-d:#3D5AFE; --indigo:#4B44D8; --ink:#1C1F2A; --ink2:#5B6075; --ink3:#6B7084;
  --line:#E6E8F0; --card:#FFFFFF; --soft:#F3F5FB; --pale:#E9EEFD; --ok:#16A34A; --ok-bg:#E4F6EA; --warn:#B86E00; --warn-bg:#FFF1DC;
  --bad:#E5484D; --bad-bg:#FDECEC; --vio:#8B5CF6; --pink:#F4B6DD; --dark:#22252E;
  --desk:#E6E9F4; --desk-ink:#1C1F2A; --desk-card:#FFFFFF; --desk-line:#D7DBEA; --desk-mut:#5B6075;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#12141C;--desk-ink:#ECEEF6;--desk-card:#1C1F2B;--desk-line:#2E3242;--desk-mut:#A3A8C0;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#12141C;--desk-ink:#ECEEF6;--desk-card:#1C1F2B;--desk-line:#2E3242;--desk-mut:#A3A8C0;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--desk);color:var(--desk-ink);font:15px/1.4 var(--f);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input{font:inherit}
img{max-width:none}
.hide{display:none!important}

/* ---------- desk layout ---------- */
#desk{height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#phoneWrap{flex-shrink:0;position:relative}
#phone{width:390px;height:844px;border-radius:52px;background:#0B0C10;padding:11px;box-shadow:0 30px 70px rgba(20,30,70,.28),inset 0 0 0 2px #2A2D36;transform-origin:center center}
#screen{width:368px;height:822px;border-radius:42px;overflow:hidden;position:relative;background:#F7F7F9;color:var(--ink);isolation:isolate}
#panel{width:340px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;color:var(--desk-ink)}
.pcard{background:var(--desk-card);border:1px solid var(--desk-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--desk-mut)}
.pcard p{margin:0;color:var(--desk-mut);font-size:13px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{padding:7px 10px;border-radius:10px;border:1px solid var(--desk-line);background:transparent;color:var(--desk-ink);font-size:13px;font-weight:600}
.pbtn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chrono{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.chrono b{font-size:34px;letter-spacing:-.02em}
.chrono.ok b{color:#16A34A}.chrono.late b{color:#E5484D}
.steps{display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps div{display:flex;justify-content:space-between;color:var(--desk-mut)}
.steps div.done{color:var(--desk-ink)}
.logline{font-size:12px;color:var(--desk-mut);max-height:120px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  #desk{padding:0;gap:0}
  #panel{display:none}
  #phone{width:100vw;height:100%;border-radius:0;padding:0;box-shadow:none}
  #screen{width:100%;height:100%;border-radius:0}
  #phoneWrap{width:100%;height:100%}
  .island{display:none}
  .status>span{visibility:hidden}
  #fab-panel{display:flex!important}
}
#fab-panel{display:none;position:absolute;left:calc(6px + env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 4px);z-index:1000;width:24px;height:24px;border-radius:12px;background:rgba(28,31,42,.38);color:#fff;align-items:center;justify-content:center;font-size:16px}
#mobileMenu{position:absolute;inset:0;z-index:950;background:rgba(10,12,20,.55);display:flex;align-items:flex-end}
#mobileMenu .msheet{width:100%;border-radius:20px 20px 0 0;max-height:85%;overflow:auto;background:#F3F5FB;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;--desk-ink:#1C1F2A;--desk-mut:#5B6075;--desk-line:#D7DBEA;--desk-card:#fff;color:#1C1F2A}
#mobileMenu .pcard{max-height:none;overflow:visible}

/* ---------- phone UI ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#F7F7F9}
.scr.sky{background:linear-gradient(180deg,#BFD0F5 0%,#E7D9F4 55%,#F8DDEB 100%)}
.scr.white{background:#fff}
.scr.dark{background:#0F1118;color:#fff}
.status{height:47px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-weight:700;font-size:15px;position:relative;z-index:30}
.status .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:999;pointer-events:none}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body>*,.sbody>*,.avpanel>*{flex-shrink:0}
img[src*="a/ic/"]{object-fit:contain;aspect-ratio:1/1;height:auto}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;flex-shrink:0}
.topbar h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center}
.topbar h1.left{text-align:left;font-size:28px}
.rb{width:44px;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(20,30,60,.08);flex-shrink:0}
.rb.ghost{background:transparent;box-shadow:none}
.rb svg{width:20px;height:20px}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
.lead{color:var(--ink2);margin:0;font-size:15px}
.small{font-size:12.5px;color:var(--ink2)}
.tiny{font-size:11px;color:var(--ink3)}
.btn{min-height:52px;border-radius:14px;background:linear-gradient(90deg,#4A63E8,#6E8BF7);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 6px 16px rgba(79,107,245,.28);flex-shrink:0}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--dark);box-shadow:none}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 10px rgba(20,30,60,.06)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--bad);box-shadow:none}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--ink2);font-weight:600;min-height:40px;display:flex;align-items:center;justify-content:center;width:100%}
.card{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(20,30,60,.04)}
.list{background:#fff;border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;border-bottom:1px solid #F0F1F6;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .t{font-weight:650;font-size:15px}
.row .s{font-size:12.5px;color:var(--ink2);line-height:1.3}
.row .grow{flex:1;min-width:0}
.row .grow .t,.row .grow .s{overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:21px;object-fit:cover;background:#EDE7FB;flex-shrink:0}
.av.sm{width:34px;height:34px}
.av.stale{opacity:.5;filter:grayscale(.6)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pri)}
.ico img{width:30px;height:30px}
.ico svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pale);color:var(--pri);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:#0B7A3B}.pill.warn{background:var(--warn-bg);color:#9A5800}.pill.bad{background:var(--bad-bg);color:#B42318}.pill.vio{background:#F1EBFE;color:#6D3FD8}.pill.gray{background:#EEF0F5;color:#4B5165}
.pill.live::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:999px;background:#fff;font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 1px 6px rgba(20,30,60,.08);min-height:36px}
.chip.on{background:var(--pri);color:#fff}
.chip img{width:20px;height:20px}
.seg{display:flex;background:#ECEEF5;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,60,.12)}
.tog{width:51px;height:31px;border-radius:16px;background:#D9DCE6;position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:left .2s}
.tog.on{background:#34C759}.tog.on::after{left:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:650;color:var(--ink2)}
.inp{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:17px;width:100%;color:var(--ink)}
.inp:focus{border-color:var(--pri);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.sec{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase;margin:6px 2px -4px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex-shrink:0}

/* bottom nav (V1 style) */
.nav{position:absolute;left:12px;right:12px;bottom:22px;display:flex;align-items:center;gap:8px;z-index:40}
.nav .rb{width:52px;height:52px;border-radius:26px}
.nav .bar{flex:1;height:58px;border-radius:29px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:space-around;box-shadow:0 6px 24px rgba(20,30,60,.14)}
.nav .bar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:#6B7084;min-width:54px;min-height:48px;justify-content:center;position:relative}
.nav .bar button svg{width:22px;height:22px}
.nav .bar button.on{color:var(--pri)}
.nav .me{width:52px;height:52px;border-radius:26px;background:#fff;box-shadow:0 6px 24px rgba(20,30,60,.14);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;position:relative}
.nav .me img{width:52px;height:52px;object-fit:cover}

/* sheets */
.sheetBack{position:absolute;inset:0;background:rgba(15,18,30,.35);z-index:60;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:calc(100% - 56px);animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -8px 30px rgba(20,30,60,.12)}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet .grab{width:100%;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:#D5D8E2}
.sheet .sbody{overflow-y:auto;padding:0 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

/* iOS system alert */
.sysBack{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:800;display:flex;align-items:center;justify-content:center;animation:fade .15s}
.sys{width:272px;border-radius:14px;background:rgba(242,242,246,.97);text-align:center;overflow:hidden;animation:pop .2s;color:#000}
.sys .st{padding:18px 16px 14px;display:flex;flex-direction:column;gap:4px}
.sys .st b{font-size:17px;font-weight:600;line-height:1.25}
.sys .st span{font-size:13px;line-height:1.3}
.sys .sb{border-top:.5px solid rgba(60,60,67,.29);min-height:44px;color:#0A7AFF;font-size:17px;width:100%;display:flex;align-items:center;justify-content:center;padding:6px}
.sys .sb.b{font-weight:600}
.sys .mapPrev{height:110px;margin:0 16px 12px;border-radius:10px;background:url(a/bdf_fest.webp) 45% 50%/320% auto;position:relative}
.sys .mapPrev::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:7px;background:#0A7AFF;border:3px solid #fff;box-shadow:0 0 0 10px rgba(10,122,255,.2)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:900;background:rgba(28,31,42,.94);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;animation:pop .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast img{width:34px;height:34px;border-radius:17px;object-fit:cover}
.push{position:absolute;left:10px;right:10px;top:52px;z-index:900;background:rgba(245,245,248,.96);color:#000;border-radius:20px;padding:12px;display:flex;gap:10px;align-items:flex-start;animation:pop .25s;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:left;width:auto}
.push .pi{width:38px;height:38px;border-radius:9px;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.push .pi img{width:30px}
.push b{font-size:14px}.push span{font-size:13.5px;line-height:1.3}

/* Android (Material) */
.sys.android{border-radius:28px;background:#F3EDF7;text-align:left;width:300px;padding-bottom:10px}
.sys.android .st{padding:24px 24px 8px}.sys.android .st b{font-size:20px;font-weight:500;color:#1D1B20}.sys.android .st span{color:#49454F;font-size:14px}
.sys.android .sb{border:0;color:#6750A4;font-size:14px;font-weight:600;justify-content:flex-end;min-height:40px;padding:0 24px}
.sys.android .mapPrev{margin:4px 24px 10px}
.mk.me .fr .name{background:#4F6BF5;color:#fff}
.mk.me .fr .head{border-width:4px;box-shadow:0 0 0 5px rgba(79,107,245,.28),0 4px 12px rgba(20,30,60,.3)}
.cone{position:absolute;left:50%;top:22px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:46px solid rgba(79,107,245,.28);transform-origin:50% 100%;margin-left:-22px;margin-top:-46px;z-index:-1}
/* map */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:linear-gradient(180deg,#BFD0F5,#EAD9F2 60%,#F8DDEB);cursor:grab}
.map.drag{cursor:grabbing}
.map .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map .world img.base{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.map .ov{position:absolute;inset:0;pointer-events:none}
.map svg.ovs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-100%);will-change:transform;contain:layout style;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .poi{width:46px;height:46px;border-radius:23px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(20,30,60,.25);border:2px solid #fff}
.mk .poi img{width:36px;height:36px}
.mk .lbl{margin-top:3px;background:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 2px 6px rgba(20,30,60,.18);color:var(--ink)}
.mk .lbl.warn{background:#FFF1DC;color:#9A5800}
.mk.clu .poi{background:var(--pri);color:#fff;font-weight:800;font-size:15px}
.mk .fr{position:relative;display:flex;flex-direction:column;align-items:center}
.mk .fr .name{background:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,60,.2);margin-bottom:3px;display:flex;gap:4px;align-items:center}
.mk .fr .head{width:46px;height:46px;border-radius:23px;border:3px solid #0E9F8A;background:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(20,30,60,.3)}
.mk .fr .head img{width:100%;height:100%;object-fit:cover}
.mk .fr .stem{width:3px;height:9px;background:#0E9F8A;border-radius:2px}
.mk.stale .fr .head{border-style:dashed;border-color:#8A8FA6;filter:grayscale(.5);opacity:.8}
.mk.stale .fr .stem{background:#8A8FA6}
.mk.me .fr .head{border-color:var(--pri);width:52px;height:52px;border-radius:26px}
.mk.me .fr .stem{background:var(--pri)}
.mk.staff .fr .head{border-color:#E58A00}
.mk.alert .poi{background:#E5484D;color:#fff;font-weight:900;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 18px rgba(229,72,77,0)}}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.mapTop{position:absolute;left:0;right:0;top:47px;z-index:20;display:flex;flex-direction:column;gap:8px;padding:4px 12px}
.evbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:18px;padding:6px 6px 6px 8px;box-shadow:0 4px 16px rgba(20,30,60,.12)}
.evbar img.lg{width:34px;height:34px;border-radius:10px}
.ctrls{position:absolute;right:12px;top:186px;z-index:20;display:flex;flex-direction:column;gap:10px}
.ctrls .stack{background:rgba(255,255,255,.95);border-radius:24px;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(20,30,60,.14);overflow:hidden}
.ctrls .stack button{width:48px;height:46px;display:flex;align-items:center;justify-content:center}
.ctrls .stack button svg{width:21px;height:21px}
.ctrls .rb{width:48px;height:48px;border-radius:24px}
.livebar{position:absolute;left:12px;right:12px;bottom:92px;z-index:20;display:flex;flex-direction:column;gap:8px}
.mini{background:rgba(255,255,255,.96);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(20,30,60,.14);text-align:left;width:100%}
.banner{position:absolute;left:12px;right:12px;z-index:25;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:650;display:flex;gap:8px;align-items:center}

/* avatar editor */
.avstage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.pedestal{position:absolute;left:50%;width:240px;height:64px;margin-left:-120px;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#FBD3EA 0%,#F4B6DD 62%,#E792C6 100%);box-shadow:0 10px 0 #E39BC8,0 0 0 6px #fff inset}
.avimg{position:relative;z-index:2;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
.avpanel{background:rgba(255,255,255,.97);border-radius:28px 28px 0 0;padding:10px 16px 26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(20,30,60,.1);position:relative;z-index:5}
.subtabs{display:flex;justify-content:center;gap:14px}
.subtabs button{width:50px;height:50px;border-radius:25px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,30,60,.1)}
.subtabs button.on{background:var(--pri);color:#fff}
.subtabs svg{width:22px;height:22px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.swatches button{width:44px;height:44px;border-radius:22px;box-shadow:inset 0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.12)}
.swatches button.on{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--pri)}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.items button{border-radius:14px;background:#fff;overflow:hidden;aspect-ratio:.8;max-width:100%;display:flex;align-items:flex-end;justify-content:center;border:2px solid transparent;position:relative}
.items button.on{border-color:var(--pri);background:#EEF2FF}
.items button img{width:100%;height:100%;object-fit:cover}
.items button.base img{object-fit:contain;padding:4px 0 0}
.items button span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.88);padding:2px}
.rail{position:absolute;right:14px;top:120px;display:flex;flex-direction:column;gap:12px;z-index:6}
.rail button{width:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(20,30,60,.1)}
.rail button.on{color:var(--pri);box-shadow:0 0 0 2px var(--pri),0 2px 10px rgba(20,30,60,.1)}
.rail svg{width:23px;height:23px}

/* keypad */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#D1D4DB;padding:6px 6px calc(30px + env(safe-area-inset-bottom,0px))}
.kp button{height:46px;border-radius:8px;background:#fff;font-size:24px;box-shadow:0 1px 0 #898A8D}
.kp button.n{background:transparent;box-shadow:none}
.otp{display:flex;gap:8px;justify-content:center}
.otp span{width:44px;height:56px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.otp span.f{border-color:var(--pri)}
.suggest{background:#fff;border-radius:10px;padding:10px;font-size:14px;display:flex;justify-content:center;gap:6px;color:var(--ink)}

/* chat */
.msgs{flex:1;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.35}
.bub.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.locmsg{align-self:flex-start;width:230px;background:#fff;border-radius:18px;overflow:hidden}
.locmsg .lm{height:110px;background:url(a/bdf_fest.webp) 50% 50%/300% auto;position:relative}
.composer{display:flex;gap:8px;align-items:center;padding:8px 12px calc(28px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.composer .inp{min-height:42px;border-radius:21px;font-size:15px;background:#F2F3F7;border:0}

/* recap / replay */
.timeline{height:44px;position:relative;display:flex;align-items:center}
.timeline input{width:100%}
.qr{width:200px;height:200px;margin:0 auto;background:#fff;padding:12px;border-radius:18px;box-shadow:0 4px 16px rgba(20,30,60,.1)}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}

/* ---------- dashboard ---------- */
#dash{position:fixed;inset:0;z-index:2000;background:#F3F6FC;color:var(--ink);display:flex;font-size:14px}
#dash .side{width:236px;background:#fff;border-right:1px solid #E6E9F2;display:flex;flex-direction:column;padding:18px 12px;gap:2px;flex-shrink:0;overflow:auto}
#dash .brand{font-weight:800;letter-spacing:.18em;font-size:20px;padding:0 10px}
#dash .brand small{display:block;font-size:10px;letter-spacing:.14em;color:var(--pri);margin-top:2px}
#dash .evsel{margin:14px 4px 10px;border:1.5px solid #F2B8BB;border-radius:12px;padding:8px 10px;font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
#dash .mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-weight:650;color:#3A3F55;text-align:left;width:100%;min-height:40px}
#dash .mi svg{width:18px;height:18px;flex-shrink:0}
#dash .mi.on{background:linear-gradient(90deg,#4A63E8,#6E8BF7);color:#fff;box-shadow:0 6px 14px rgba(79,107,245,.3)}
#dash .mi .badge{position:static;margin-left:auto;border:0}
#dash .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#dash .top{display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap}
#dash .top .search{flex:1;min-width:160px;background:#fff;border-radius:14px;min-height:42px;display:flex;align-items:center;padding:0 12px;color:var(--ink3);gap:8px}
#dash .kchip{background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
#dash .content{flex:1;overflow:auto;padding:0 20px 24px;display:flex;flex-direction:column;gap:14px}
#dash h1{margin:6px 0 0;font-size:30px;color:var(--pri-d);letter-spacing:-.02em}
#dash .sub{color:var(--ink2);margin:-8px 0 0}
#dash .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
#dash .kpi{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
#dash .kpi span{color:var(--ink2);font-size:12.5px;font-weight:600}
#dash .kpi b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#dash .kpi small{color:var(--ink2);font-size:12px}
#dash .dcard{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
#dash .dcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
#dash .cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;min-height:0}
#dash .dmap{position:relative;height:560px;border-radius:16px;overflow:hidden;background:#E9ECF6}
#dash .layers{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:30;flex-wrap:wrap}
#dash .layers button{background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:11.5px;letter-spacing:.05em;box-shadow:0 2px 8px rgba(20,30,60,.12)}
#dash .layers button.on{background:var(--pri);color:#fff}
#dash .zpanel{position:absolute;left:12px;top:12px;z-index:30;background:rgba(255,255,255,.95);border-radius:14px;padding:12px 14px;min-width:240px;box-shadow:0 6px 20px rgba(20,30,60,.12);display:flex;flex-direction:column;gap:6px}
#dash table{width:100%;border-collapse:collapse;font-size:13px}
#dash th{text-align:left;color:var(--ink2);font-weight:650;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
#dash td{padding:9px 6px;border-bottom:1px solid #F1F2F7;vertical-align:middle}
#dash tr.hl td{background:#FFF6F6}
#dash .bar{height:8px;border-radius:4px;background:#EEF0F6;overflow:hidden}
#dash .bar i{display:block;height:100%;border-radius:4px}
#dash .dbtn{min-height:38px;padding:0 14px;border-radius:11px;background:var(--pri);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#dash .dbtn.w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
#dash .dbtn.r{background:var(--bad)}
#dash .dbtn.g{background:var(--ok)}
#dash .tw{overflow-x:auto}
#dash .content>*{flex-shrink:0}
#dash .dbtn svg{width:16px;height:16px;flex-shrink:0}
#dash .note{background:var(--pale);color:#2A3A8C;border-radius:12px;padding:10px 12px;font-size:13px}
@media (max-width:900px){
  #dash .side{display:none}
  #dash .cols{grid-template-columns:minmax(0,1fr)}
  #dash .row4{grid-template-columns:repeat(2,minmax(0,1fr))}
  #dash .dmap{height:420px}
  #dash .dmenu{display:flex!important}
}
#dash .dmenu{display:none}

/* carte vivante */
.map canvas.fx{position:absolute;left:0;top:0;pointer-events:none}
.map .ov,.map svg.ovs{transition:opacity .35s}
.map{transition:background 1.2s}
.mk .fr{transform-origin:50% 100%}
.mk .fr .head{animation:breathe 3.4s ease-in-out infinite}
.mk.walk .fr{animation:bob .38s ease-in-out infinite}
.mk .fr::after{content:'';width:22px;height:7px;border-radius:50%;background:rgba(15,18,40,.28);margin-top:-2px;filter:blur(1px)}
@keyframes breathe{50%{transform:translateY(-1.5px) scale(1.015)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.mk.me+.halo,.halo.me{animation:none}
.gtx{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6;animation:gtx 2.5s ease forwards;text-align:center}
.gtx img{width:64px;height:64px;border-radius:18px;box-shadow:0 10px 30px rgba(30,20,90,.35)}
.gtx b{font-size:24px;font-weight:850;color:#1A1D2E;text-shadow:0 2px 14px rgba(255,255,255,.9)}
.gtx span{font-size:13px;font-weight:700;color:#4A4F66;text-shadow:0 1px 10px #fff}
@keyframes gtx{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}18%{opacity:1;transform:translate(-50%,-50%)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1.04)}}
.map.nite .mk .poi{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(170,140,255,.55)}
@media (prefers-reduced-motion: reduce){.mk .fr .head,.mk.walk .fr,.gtx{animation:none}}
.map canvas.fx2{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
.godsN~.gtx b,.gtx.n b{color:#fff;text-shadow:0 2px 18px rgba(120,90,255,.8)}
.gtx.n span{color:#D8DAF0;text-shadow:0 1px 10px rgba(0,0,0,.6)}

/* v5 : plateau inclinable (vue 3D), boussole */
.map .tl{position:absolute;inset:0;transform-style:flat;will-change:transform}
.map.t3d .mk .lbl{box-shadow:0 3px 10px rgba(20,30,60,.22)}
.ctrls .stack button.cmp svg{transition:none}
.ctrls .stack button.cmp{border-bottom:1px solid rgba(20,30,60,.08)}

/* v5 : POI à l'échelle du zoom, pas de pastille chiffrée */
.mk.pm .poi{transform:scale(var(--pk,1));transform-origin:50% 100%;transition:transform .18s}
.mk.pm .lbl{transform:translateY(calc((var(--pk,1) - 1) * 46px))}
.map.lowz .mk.pm:not(.key) .lbl{display:none}

/* v5 : bulles sur la carte, mode écran, fenêtres blanches légèrement translucides */
.mk .fr .bub{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);max-width:170px;width:max-content;background:#fff;color:var(--ink);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;line-height:1.25;box-shadow:0 4px 14px rgba(20,30,60,.22);white-space:normal;text-align:center}
.mk .fr .bub::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.mk.me .fr .bub{background:#4F6BF5;color:#fff}.mk.me .fr .bub::after{background:#4F6BF5}
#screen.kiosk .mapTop,#screen.kiosk .ctrls,#screen.kiosk .livebar,#screen.kiosk .nav,#screen.kiosk .map .ov,#screen.kiosk .map svg.ovs,#screen.kiosk .sb,#screen.kiosk #fab-panel{display:none!important}
.kioskExit{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:60;background:rgba(28,31,42,.86);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.kioskExit.on{opacity:1;pointer-events:auto}
.sheet{background:rgba(255,255,255,.94);}

/* v5 : les marqueurs (z-index de profondeur en 3D) restent confinés à la carte */
.map{isolation:isolate}.map .ov{isolation:isolate}

/* v5.1 : repères du premier lancement */
.tour{position:absolute;inset:0;z-index:80}
.tourHole{position:absolute;border-radius:18px;box-shadow:0 0 0 9999px rgba(15,18,40,.55);pointer-events:none;transition:all .25s}
.tourCard{position:absolute;left:16px;right:16px;background:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tourCard b{font-size:16px}.tourCard span{font-size:14px;color:var(--ink2);line-height:1.4}

/* v5.1 : finitions de la revue d'écrans */
.ctrls .stack button[hidden]{display:none}
.mk .fr .bub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;font-size:11.5px;padding:5px 9px}
.tourCard .tiny{white-space:nowrap}

/* v6 : avatars haute qualité debout sur la carte */
.mk .fr.fullb{align-items:center}
.mk .fr.fullb .bodyimg{height:calc(74px * var(--pk,1));width:auto;display:block;transform-origin:50% 100%;will-change:transform;animation:breathe 3.4s ease-in-out infinite;position:relative;z-index:1}
.mk .fr.fullb .foot{width:calc(38px * var(--pk,1));height:calc(13px * var(--pk,1));margin-top:calc(-7px * var(--pk,1));border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 45%,transparent),transparent);box-shadow:inset 0 0 0 2.5px var(--c);position:relative;z-index:0}
.mk.me .fr.fullb .foot{box-shadow:inset 0 0 0 3px var(--c),0 0 12px 2px rgba(79,107,245,.55)}
.mk.me .fr.fullb .bodyimg{height:calc(82px * var(--pk,1))}
.mk.stale .fr.fullb .bodyimg{filter:grayscale(.85) drop-shadow(0 3px 4px rgba(20,20,50,.25));opacity:.7}
.mk.walk .fr.fullb .bodyimg{animation:bob .38s ease-in-out infinite}
.mk .fr.fullb .name{margin-bottom:2px}
@media (prefers-reduced-motion: reduce){.mk .fr.fullb .bodyimg{animation:none}}
.avstage.pick{position:relative;display:flex;justify-content:center}
.avstage.pick .ped{position:absolute;bottom:10px;left:50%;width:190px;height:40px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,#F4A9CF,#E98FBF 70%,transparent);z-index:1}
.avstage.pick #big{height:290px;position:relative;z-index:2;margin-bottom:22px;filter:none}
.avstage.pick #big.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92);opacity:.5}100%{transform:none;opacity:1}}
.chargrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.chargrid button{aspect-ratio:1;border-radius:50%;overflow:hidden;background:#F3F0FB;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(20,30,60,.12)}
.chargrid button.on{box-shadow:0 0 0 3px var(--pri),0 2px 8px rgba(20,30,60,.2)}
.chargrid img{width:100%;height:100%;object-fit:cover}

/* v6 : groupe de personnes au même endroit */
.mk .grpb{position:absolute;bottom:6px;right:-18px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pri);color:#fff;font-weight:900;font-size:12.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2.5px #fff,0 3px 8px rgba(20,30,60,.3);z-index:3}

/* v6 : studio de création d'avatar */
.studio{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
.stTop{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:48px}.stTop b{font-size:18px;font-weight:850}
.stTop .rb{width:42px;height:42px;background:rgba(255,255,255,.85)}
.stStage{position:relative;flex:1;min-height:250px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}

.atmo .aFg.f1{left:-38%;top:-6%}.atmo .aFg.f2{left:56%;top:78%;animation-delay:-9s}.atmo .aFg.f3{left:64%;top:-10%;animation-delay:-17s}

function edgePair(e) { return e.includes('-') ? e.split('-') : [e[0], e.slice(1)]; }

let MAP_ASPECT = 3000 / 1891; // rapport largeur/hauteur du plan courant
const dist = (a, b) => Math.hypot((a[0] - b[0]) * MAP_ASPECT, a[1] - b[1]);
function nearestNode(p) { let best = null, bd = 1e9; for (const k in NODES) { const d = dist(NODES[k], p); if (d < bd) { bd = d; best = k; } } return best; }
function route(from, to) {
  const open = new Set([from]), g = { [from]: 0 }, prev = {};
  while (open.size) {
    let cur = null, cf = 1e9; open.forEach(n => { const f = g[n] + dist(NODES[n], NODES[to]); if (f < cf) { cf = f; cur = n; } });
    if (cur === to) { const p = [to]; while (prev[p[0]]) p.unshift(prev[p[0]]); return p; }
    open.delete(cur);
    for (const nb of ADJ[cur] || []) { if (RESTRICTED.has(nb) && nb !== to && !RESTRICTED.has(from)) continue; const ng = g[cur] + dist(NODES[cur], NODES[nb]); if (g[nb] === undefined || ng < g[nb]) { g[nb] = ng; prev[nb] = cur; open.add(nb); } }

}

    if (s.t >= 1) { s.t = 0; s.i = (s.i + 1) % (s.seq.length - 1); }
    const pause = s.seq[s.i] === s.seq[0] && s.t < .25; // arrêts naturels

}

V.replay = () => {

  const pts = path.map(k => NODES[k]); let L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + dist(pts[i - 1], pts[i]));
  const el = mount(`<div id="mv"></div>${statusBar()}<div class="mapTop"><div class="evbar"><button class="rb ghost" id="bk" aria-label="Retour">${I.back}</button><div style="flex:1"><b>Replay de ma soirée</b><div class="small"><span class="pill ok" style="padding:1px 7px">● REPLAY</span> ${EVENT.name}</div></div></div></div>

  if (MV) MV.destroy();
  let k = 0, playing = false, speed = 1; const trail = [];
  MV = new MapView($('#mv', el), { at: [52, 55], zoom: .36, cluster: false, strict: true, markers: () => { const at = posAt(k); return [...POIS.filter(o => ['scene', 'barO', 'barE', 'fosse', 'rotonde', 'entree'].includes(o.id)).map(o => ({ ...poiMarker(o, () => toast(`${o.n} : ${{ scene: '1 h 05', barO: '22 min', barE: '14 min', fosse: '2 h 12', rotonde: '37 min', entree: '6 min' }[o.id]} passés ici ce soir`)), z: 2 })), personMarker('me', 'Moi', meHead(), at, { me: true, acc: 3 })]; } });
  function posAt(k) { const d = k / 1000 * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const t = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; }
  const upd = () => { const at = posAt(k); const done = []; for (let j = 0; j <= 60; j++) { const kk = j / 60 * k; done.push(posAt(kk)); } MV.setRoute(done, '#8B5CF6');
    $('#rh', el).textContent = fmtClock(22 * 60 + 41 + k / 1000 * 317); $('#rd', el).textContent = (k / 1000 * 3.4).toFixed(1).replace('.', ',') + ' km'; $('#rs', el).textContent = Math.round(k / 1000 * 4620).toLocaleString('fr-FR'); $('#rz', el).textContent = zoneOf(at); $('#sl', el).value = k; };
  const tk = dt => { if (!document.body.contains(el)) { tickers.delete(tk); return; } if (playing) { k = Math.min(1000, k + dt * 40 * speed); if (k >= 1000) playing = false; upd(); $('#pp', el).innerHTML = playing ? I.pause : I.play; } };

  $('#sl', el).oninput = e => { k = +e.target.value; upd(); };

  $('#bk', el).onclick = V.recap; upd();
};

function saveSession() { try { if (!ST.account || ST.role !== 'visitor') return; const o = { venue: VENUE.id, t: Date.now() }; SESSION_KEYS.forEach(k => o[k] = ST[k]); localStorage.setItem(SESSION_KEY, JSON.stringify(o)); } catch (_) {} }
function loadSession() { try { const o = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); if (!o || !o.account || Date.now() - o.t > 7 * 864e5) return null; return o; } catch (_) { return null; } }

// ---------- Avatars superposés : répartis en éventail, pseudo toujours lisible (« superposition pas parfaite ») ----------
// (le calcul est fait dans MapView.renderMarkers via MapView.fan)
MapView.fan = function (list, mv) { // plusieurs personnes au même endroit : jamais l'une cachée sous l'autre
  const pk = mv._pk || 1, R = 34 * pk, off = {}, hide = new Set(), badge = {}, used = new Set();
  const pp = list.filter(m => m.id && m.id.startsWith('p_')).map(m => ({ m, p: mv.projS(m.at) })).sort((a, b) => (b.m.id === 'p_me') - (a.m.id === 'p_me'));
  pp.forEach(a => {
    if (used.has(a.m.id)) return; const g = pp.filter(b => !used.has(b.m.id) && Math.hypot(a.p[0] - b.p[0], a.p[1] - b.p[1]) < R); g.forEach(b => used.add(b.m.id)); if (g.length < 2) return;
    const cx = g.reduce((s, b) => s + b.p[0], 0) / g.length, cy = g.reduce((s, b) => s + b.p[1], 0) / g.length;
    const show = g.length <= 4 ? g : g.slice(0, 3), n = show.length, sp = (n === 2 ? 34 : n === 3 ? 32 : 30) * pk;
    // 2 à 4 : en arc autour du point (prénoms décalés en hauteur pour rester lisibles) ; 5 et plus : 3 visibles + pastille « +N »
    show.forEach((b, j) => { const k = j - (n - 1) / 2; off[b.m.id] = [cx - b.p[0] + k * sp, cy - b.p[1] + Math.abs(k) * 7 * pk - (j % 2 ? 12 * pk : 0)]; });
    if (g.length > 4) { g.slice(3).forEach(b => hide.add(b.m.id)); badge[show[1].m.id] = { n: g.length - 3, ids: g.map(b => b.m.id.slice(2)) }; }
  });
  return { off, hide, badge };
};

// ---------- Fenêtres : glisser vers le bas depuis tout le panneau pour fermer (pas seulement la poignée) ----------
document.addEventListener('pointerdown', e => {
  const sh = e.target.closest('.sheet'); if (!sh || e.target.closest('input,textarea,select,.grab')) return; const body = sh.querySelector('.sbody'); if (body && body.scrollTop > 0) return;
  const y0 = e.clientY, x0 = e.clientX; let drag = false;
  const mv = ev => { const dy = ev.clientY - y0; if (!drag && dy > 12 && dy > Math.abs(ev.clientX - x0) * 1.5) drag = true; if (drag) sh.style.transform = `translateY(${Math.max(0, dy)}px)`; };
  const up = ev => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); if (!drag) return; sh.style.transform = ''; const stop = c => { c.stopPropagation(); c.preventDefault(); }; addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => removeEventListener('click', stop, true), 50); if (ev.clientY - y0 > 110) closeSheet(); };

};

async function api(method, path, body) {

    if (!r.ok) throw new Error(j.message || 'Erreur ' + r.status);

    throw new Error(e.name === 'AbortError' ? 'Le serveur ne répond pas. Vérifie ta connexion et réessaie.' : e.message === 'Failed to fetch' || e.message === 'Load failed' ? 'Pas de connexion au serveur. Vérifie ton réseau.' : e.message);

}

async function realConnect() {

  REAL.connecting = true;
  try {
    if (!REAL.eventId) REAL.eventId = (await api('GET', '/v1/events/BDF-DEMO')).id;
