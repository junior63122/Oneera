<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard — Scènes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 1000px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,1000px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { spec: { active: 'Programmation', h: 1000, title: 'Scènes', sub: 'Les scènes du lieu, leur capacité et leur occupation en direct', actions: ['+ Ajouter une scène'], rows: [
      [{ t: 'kpi', l: 'Scènes', v: '3' }, { t: 'kpi', l: 'Occupation principale', v: '74 %', c: '#D98A00', s: '≈ 1 850 / 2 500 (estimation)' }, { t: 'kpi', l: 'Club', v: '41 %', s: '≈ 330 / 800' }, { t: 'kpi', l: 'Terrasse', v: '52 %', s: '≈ 260 / 500' }],
      [{ t: 'map', w: 2, h: 440, sel: true, panel: { title: 'Scène principale', stats: [{ v: '74 %', l: 'occupation estimée', c: '#D98A00' }, { v: 'Live', l: '[ARTISTE 2] en cours', c: '#0B5A50' }] } },
       { t: 'hbars', w: 1, title: 'Occupation en direct', items: [{ l: 'Scène principale', v: '74 %', p: 74, c: '#D98A00' }, { l: 'Club', v: '41 %', p: 41, c: '#12A38F' }, { l: 'Terrasse', v: '52 %', p: 52, c: '#12A38F' }] }],
      [{ t: 'cards', title: 'Fiches scènes', cols: 3, h: 130, items: [
        { tag: 'En direct', tone: 'ok', t: 'Scène principale', s: 'Capacité 2 500 · 6 artistes\nSeuil d’alerte : 90 %' },
        { tag: 'En direct', tone: 'ok', t: 'Club', s: 'Capacité 800 · 5 artistes\nSeuil d’alerte : 90 %' },
        { tag: 'En direct', tone: 'ok', t: 'Terrasse', s: 'Capacité 500 · 3 artistes\nSeuil d’alerte : 85 %' }
      ] }]
    ] } };
  }
}
</script>
</body>
</html>
