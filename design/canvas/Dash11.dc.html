<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard — Créer un événement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 900px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { spec: { scope: 'global', active: 'Événements', h: 900, title: 'Créer un événement', sub: 'Configurez les paramètres de votre nouvel événement', actions: ['Créer l’événement'], rows: [
      [{ t: 'form', title: 'Informations générales', cols: 3, fields: [
        { l: 'Nom de l’événement', v: 'Ex. : Festival Horizon 2027', ph: true },
        { l: 'Type d’événement', v: 'Festival ▾' },
        { l: 'Lieu (permanent ou site)', v: 'Rechercher un lieu existant…', ph: true },
        { l: 'Début', v: 'jj/mm/aaaa · hh:mm', ph: true },
        { l: 'Fin (peut dépasser minuit)', v: 'jj/mm/aaaa · hh:mm', ph: true },
        { l: 'Capacité totale', v: '50 000' },
        { l: 'Description', v: 'Présentation pour les équipes…', ph: true, wide: true, tall: 70 }
      ] }],
      [{ t: 'form', w: 1, title: 'Configuration spatiale', cols: 1, fields: [
        { l: 'Importer le plan', v: 'Glisser un fichier · .dwg, .pdf, .json · 50 Mo max', ph: true, tall: 110 },
        { l: 'Géoréférencement', v: '3 points relevés au GPS · à faire', ph: true }
      ] },
       { t: 'list', w: 1, title: 'Étapes avant publication', items: [
        { t: '1 · Dessiner les zones et les murs', s: 'Zones fonctionnelles et surfaces praticables séparées', tone: 'info' },
        { t: '2 · Poser et enregistrer les balises', s: 'iBeacon · 1 balise / 50–80 m² · au moins une par salle', tone: 'info' },
        { t: '3 · Calibrer (lieu vide, ~1 h)', s: 'Avec l’app ONEERA Mesure', tone: 'warn' },
        { t: '4 · Valider la précision', s: 'Seuils de la grille de validation atteints', tone: 'ok' },
        { t: '5 · Brancher le comptage d’entrée (recommandé)', s: 'Pour des chiffres de présence mesurés', tone: 'purple' }
      ] }]
    ] } };
  }
}
</script>
</body>
</html>
