<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler un problème</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B5EE8}a:hover{color:#3346C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7FB; color: #1A1C2B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 18px 26px; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1C2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<span style="font: 800 17px Inter, sans-serif">Créer un signalement</span>
<span style="width: 44px"></span>
</div>
<div style="display: flex; gap: 10px; align-items: center; background: #FDE7E8; border-radius: 14px; padding: 12px 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2282F" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
<span style="font-size: 13px; line-height: 1.4; color: #7A1A1F; font-weight: 600">Urgence vitale : appelez le 112. ONEERA alerte l'équipe du lieu mais ne remplace pas les secours.</span>
</div>
<span style="font: 700 14px Inter, sans-serif; color: #3A3F55">Que se passe-t-il ?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button style="{{c.box}}">
<span style="{{c.icon}}">{{c.glyph}}</span>
<span style="font: 700 12px Inter, sans-serif; color: #1A1C2B">{{c.n}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 12px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5EE8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1"><span style="font: 700 14px Inter, sans-serif">Bar · rez-de-chaussée</span><span style="font: 500 12px Inter, sans-serif; color: #5A5F77">Votre position actuelle · précision ± 3 m</span></span>
<button style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #EEF0F8; color: #4B5EE8; font: 700 12px Inter, sans-serif">Modifier</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font: 700 13px Inter, sans-serif; color: #3A3F55">Précisions (facultatif)</span>
<textarea rows="3" placeholder="Ex. : une personne a fait un malaise près du comptoir" style="border: 1px solid #DDE0EB; border-radius: 14px; padding: 12px; font: 400 14px Inter, sans-serif; color: #1A1C2B; resize: none; background: #FFFFFF"></textarea>
</label>
<div style="flex-grow: 1"></div>
<button style="height: 56px; border: 0; border-radius: 16px; background: #C2282F; color: #FFFFFF; font: 700 16px Inter, sans-serif">Envoyer à l'équipe du lieu</button>
<span style="font-size: 12px; color: #5A5F77; text-align: center">Sans réseau, le signalement part dès que la connexion revient.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:96px;border-radius:16px;background:#FFFFFF;';
    function icon(bg, fg) { return 'width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font:800 18px Inter,sans-serif;background:' + bg + ';color:' + fg; }
    return {
      cats: [
        { n: 'Médical', glyph: '+', box: base + 'border:2px solid #C2282F', icon: icon('#FDE7E8', '#C2282F') },
        { n: 'Danger', glyph: '!', box: base + 'border:1px solid #E3E5EE', icon: icon('#FFF0DC', '#9A5B00') },
        { n: 'Affluence', glyph: '≡', box: base + 'border:1px solid #E3E5EE', icon: icon('#EDE7FB', '#6A3FA8') },
        { n: 'Technique', glyph: '⚙', box: base + 'border:1px solid #E3E5EE', icon: icon('#E4EEFB', '#2C5BA8') },
        { n: 'Objet perdu', glyph: '?', box: base + 'border:1px solid #E3E5EE', icon: icon('#DDF4EF', '#0B5A50') },
        { n: 'Autre', glyph: '…', box: base + 'border:1px solid #E3E5EE', icon: icon('#EEF0F8', '#4A4F66') }
      ]
    };
  }
}
</script>
</body>
</html>
