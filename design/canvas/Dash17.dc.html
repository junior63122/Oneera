<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard — Modération des signalements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 900px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { spec: { scope: 'global', active: 'Système social', h: 900, title: 'Modération des signalements', sub: 'Signalements entre utilisateurs : messages, profils, photos', actions: ['⚙ Règles de modération'], rows: [
      [{ t: 'kpi', l: 'Signalements', v: '5', c: '#7C5BD6' }, { t: 'kpi', l: 'Critiques', v: '3', c: '#1A1C2B' }, { t: 'kpi', l: 'Automatiques', v: '2', c: '#D98A00', s: 'filtre anti-spam' }, { t: 'kpi', l: 'Traités aujourd’hui', v: '45', c: '#0B5A50', tint: '#E7F5EF' }],
      [{ t: 'list', w: 1, title: 'Signalements actifs', link: 'Filtrer', items: [
        { t: 'Message signalé #02 · critique', s: 'Contenu suspect envoyé à 3 utilisateurs · signalé par @lina', tag: 'Critique', tone: 'danger', bg: true },
        { t: 'Photo de profil #13', s: 'Image inappropriée · signalée par 2 utilisateurs', tag: 'Visible', tone: 'warn' },
        { t: 'Spam #04', s: 'Messages répétés · filtre automatique', tag: 'Spam', tone: 'purple' },
        { t: 'Spam #03', s: 'Lien suspect · filtre automatique', tag: 'Spam', tone: 'purple' }
      ] },
       { t: 'list', w: 1, title: 'Message signalé #02 · @xenon_99', tint: '#FFF7F7', items: [
        { t: 'Contenu signalé', s: '« ••••••• » (masqué jusqu’à la décision)', tone: 'neutral' },
        { t: 'Signalement', s: 'Par @lina · il y a 12 min', tone: 'info' },
        { t: 'Historique des sanctions', s: 'Avertissement le 12/09 · silence 24 h le 03/10', tone: 'warn' },
        { t: 'Actions directes', s: 'Ignorer · Avertir l’utilisateur · Silence 24 h · Bannissement', tone: 'danger', bg: true }
      ] }]
    ] } };
  }
}
</script>
</body>
</html>
