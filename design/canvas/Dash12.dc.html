<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard — Comparaison d'événements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 1400px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,1400px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { spec: { scope: 'global', active: 'Comparaison', h: 1400, title: 'Comparaison de données', sub: 'Analysez la performance croisée de deux événements ou de deux dates du même événement', actions: ['Exporter', '+ Modifier la sélection'], rows: [
      [{ t: 'kpi', l: 'Événement A', v: '[ÉVÉNEMENT A]', c: '#1A1C2B', s: 'présence comptée 12 k · couverture 22 %' }, { t: 'kpi', l: 'Événement B', v: '[ÉVÉNEMENT B]', c: '#1A1C2B', s: 'présence comptée 9 k · couverture 28 %' }],
      [{ t: 'line', w: 2, title: 'Pics d’affluence (présence comptée) — A en bleu, B en violet', y: [10, 30, 70, 95, 60, 30, 20], y2: [5, 15, 35, 50, 85, 90, 40], axis: ['18 h', '20 h', '22 h', '0 h', '2 h', '4 h'] },
       { t: 'donuts', w: 1, title: 'Répartition des incidents', items: [{ l: 'Événement A · 41', center: '41', segs: [{ p: 40 }, { p: 30 }, { p: 20 }, { p: 10 }] }, { l: 'Événement B · 60', center: '60', segs: [{ p: 25 }, { p: 35 }, { p: 25 }, { p: 15 }] }] }],
      [{ t: 'hbars', w: 1, title: 'Répartition du staff', items: [{ l: 'Événement A', v: '142 pers.', p: 80 }, { l: 'Événement B', v: '104 pers.', p: 58 }] },
       { t: 'donuts', w: 1, title: 'Communications diffusées', items: [{ l: 'Événement A · 61', center: '61', segs: [{ p: 50 }, { p: 30 }, { p: 20 }] }, { l: 'Événement B · 44', center: '44', segs: [{ p: 40 }, { p: 35 }, { p: 25 }] }] },
       { t: 'hbars', w: 1, title: 'Visiteurs localisés (app)', items: [{ l: 'Événement A', v: '2 640 · 22 %', p: 22 }, { l: 'Événement B', v: '2 520 · 28 %', p: 28 }] }],
      [{ t: 'map', w: 1, h: 300, heat: true, panel: { title: 'A · Zone A', stats: [{ v: '≈ 2,6', l: 'pers / m²', c: '#D98A00' }, { v: '8', l: 'alertes', c: '#C2282F' }] } }, { t: 'map', w: 1, h: 300, heat: true, panel: { title: 'B · Zone A', stats: [{ v: '≈ 1,9', l: 'pers / m²', c: '#D98A00' }, { v: '3', l: 'alertes', c: '#C2282F' }] } }],
      [{ t: 'timeline', label: 'Replay synchronisé A / B', from: '21:45', to: '02:00', p: 46 }]
    ] } };
  }
}
</script>
</body>
</html>
