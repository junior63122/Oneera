<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard — Organisateurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 1050px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,1050px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    var st = function (s, t) { return { b: s, tone: t }; };
    return { spec: { scope: 'global', active: 'Organisateurs', h: 1050, title: 'Liste des organisateurs', sub: 'Profils, niveaux d’accès et déploiements actifs', actions: ['Exporter', '+ Ajouter un organisateur'], rows: [
      [{ t: 'kpi', l: 'Total', v: '35' }, { t: 'kpi', l: 'Actifs', v: '28', c: '#0B5A50' }, { t: 'kpi', l: 'Inactifs', v: '7', c: '#C2282F' }],
      [{ t: 'table', tpl: '1.4fr 0.8fr 1fr 1fr 1.4fr 0.6fr', cols: ['Organisateur', 'Statut', 'Événements', 'Accès', 'Activité récente', 'Actions'], hl: 2, rows: [
        ['[ORGANISATEUR 1]', st('Actif', 'ok'), '4 en cours', 'Niveau 3', 'Connexion secteur 4-B', '✎ ⋯'],
        ['[ORGANISATEUR 2]', st('Actif', 'ok'), '12 en cours', 'Niveau 2', 'Mise à jour du planning', '✎ ⋯'],
        ['[ORGANISATEUR 3]', st('Suspendu', 'danger'), '—', 'Révoqué', 'Accès révoqué', '✎ ⋯'],
        ['[ORGANISATEUR 4]', st('Actif', 'ok'), '12 en cours', 'Niveau 2', 'Validation badge', '✎ ⋯']
      ] }],
      [{ t: 'list', w: 1, title: 'Invitations sécurisées', items: [{ t: 'invitation · niveau 2', s: 'Expire dans 24 h', tag: 'Annuler', tone: 'danger' }, { t: 'invitation · niveau 3', s: 'Expire dans 24 h', tag: 'Annuler', tone: 'danger' }] },
       { t: 'list', w: 2, title: '[ORGANISATEUR 3] · détail', items: [
        { t: 'Événements associés', s: '[ÉVÉNEMENT A] · [ÉVÉNEMENT B]', tone: 'info' },
        { t: 'Permissions et accès', s: 'Niveau de sécurité : 5 (administrateur) · accès spatial : secteurs 4-A, 4-B, VIP · flux financier : actif', tone: 'purple' },
        { t: 'Historique d’activité', s: 'Connexion secteur 4-B (il y a 2 h) · modification du planning · validation accès zone 2', tone: 'neutral' },
        { t: 'Actions administrateur', s: 'Modifier · Suspendre', tone: 'danger' }
      ] }]
    ] } };
  }
}
</script>
</body>
</html>
