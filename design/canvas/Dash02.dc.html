<html lang="fr">
<head>

<title>Dashboard — Centre d'alertes</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; min-height: 1300px"><dc-import name="DashPage" spec="{{spec}}" hint-size="1440px,1300px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>

        { t: 'Description', s: 'Personne au sol près de la porte B, consciente. Signalée par un visiteur.', tone: 'neutral' },

}
</script>
