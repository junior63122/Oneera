<title>Prototype ONEERA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Studio desk around a phone: left = live phone, right = scenario panel. Dashboard takes the full width. */
:root{
  --pri:#4F6BF5; --pri2:#6E8BF7; --pri-d:#3D5AFE; --indigo:#4B44D8; --ink:#1C1F2A; --ink2:#5B6075; --ink3:#6B7084;
  --line:#E6E8F0; --card:#FFFFFF; --soft:#F3F5FB; --pale:#E9EEFD; --ok:#16A34A; --ok-bg:#E4F6EA; --warn:#E58A00; --warn-bg:#FFF1DC;
  --bad:#E5484D; --bad-bg:#FDECEC; --vio:#8B5CF6; --pink:#F4B6DD; --dark:#22252E;
  --desk:#E6E9F4; --desk-ink:#1C1F2A; --desk-card:#FFFFFF; --desk-line:#D7DBEA; --desk-mut:#5B6075;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#12141C;--desk-ink:#ECEEF6;--desk-card:#1C1F2B;--desk-line:#2E3242;--desk-mut:#A3A8C0;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#12141C;--desk-ink:#ECEEF6;--desk-card:#1C1F2B;--desk-line:#2E3242;--desk-mut:#A3A8C0;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--desk);color:var(--desk-ink);font:15px/1.4 var(--f);overflow:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input{font:inherit}
img{max-width:none}
.hide{display:none!important}

/* ---------- desk layout ---------- */
#desk{height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#phoneWrap{flex-shrink:0;position:relative}
#phone{width:390px;height:844px;border-radius:52px;background:#0B0C10;padding:11px;box-shadow:0 30px 70px rgba(20,30,70,.28),inset 0 0 0 2px #2A2D36;transform-origin:center center}
#screen{width:368px;height:822px;border-radius:42px;overflow:hidden;position:relative;background:#F7F7F9;color:var(--ink);isolation:isolate}
#panel{width:340px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;color:var(--desk-ink)}
.pcard{background:var(--desk-card);border:1px solid var(--desk-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--desk-mut)}
.pcard p{margin:0;color:var(--desk-mut);font-size:13px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{padding:7px 10px;border-radius:10px;border:1px solid var(--desk-line);background:transparent;color:var(--desk-ink);font-size:13px;font-weight:600}
.pbtn.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chrono{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.chrono b{font-size:34px;letter-spacing:-.02em}
.chrono.ok b{color:#16A34A}.chrono.late b{color:#E5484D}
.steps{display:flex;flex-direction:column;gap:4px;font-size:13px}
.steps div{display:flex;justify-content:space-between;color:var(--desk-mut)}
.steps div.done{color:var(--desk-ink)}
.logline{font-size:12px;color:var(--desk-mut);max-height:120px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;font-variant-numeric:tabular-nums}
@media (max-width:820px){
  #desk{padding:0;gap:0}
  #panel{display:none}
  #phone{width:100vw;height:100%;border-radius:0;padding:0;box-shadow:none}
  #screen{width:100%;height:100%;border-radius:0}
  #phoneWrap{width:100%;height:100%}
  .island{display:none}
  .status>span{visibility:hidden}
  #fab-panel{display:flex!important}
}
#fab-panel{display:none;position:absolute;left:calc(80px + env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 10px);z-index:1000;width:30px;height:30px;border-radius:15px;background:rgba(28,31,42,.72);color:#fff;align-items:center;justify-content:center;font-size:16px}
#mobileMenu{position:absolute;inset:0;z-index:950;background:rgba(10,12,20,.55);display:flex;align-items:flex-end}
#mobileMenu .msheet{width:100%;border-radius:20px 20px 0 0;max-height:85%;overflow:auto;background:#F3F5FB;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;--desk-ink:#1C1F2A;--desk-mut:#5B6075;--desk-line:#D7DBEA;--desk-card:#fff;color:#1C1F2A}
#mobileMenu .pcard{max-height:none;overflow:visible}

/* ---------- phone UI ---------- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#F7F7F9}
.scr.sky{background:linear-gradient(180deg,#BFD0F5 0%,#E7D9F4 55%,#F8DDEB 100%)}
.scr.white{background:#fff}
.scr.dark{background:#0F1118;color:#fff}
.status{height:47px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-weight:700;font-size:15px;position:relative;z-index:30}
.status .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:999;pointer-events:none}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.body>*,.sbody>*,.avpanel>*{flex-shrink:0}
img[src*="a/ic/"]{object-fit:contain;aspect-ratio:1/1;height:auto}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;flex-shrink:0}
.topbar h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center}
.topbar h1.left{text-align:left;font-size:28px}
.rb{width:44px;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(20,30,60,.08);flex-shrink:0}
.rb.ghost{background:transparent;box-shadow:none}
.rb svg{width:20px;height:20px}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
.lead{color:var(--ink2);margin:0;font-size:15px}
.small{font-size:12.5px;color:var(--ink2)}
.tiny{font-size:11px;color:var(--ink3)}
.btn{min-height:52px;border-radius:14px;background:linear-gradient(90deg,#4A63E8,#6E8BF7);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 6px 16px rgba(79,107,245,.28);flex-shrink:0}
.btn:active{transform:scale(.985)}
.btn.dark{background:var(--dark);box-shadow:none}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 10px rgba(20,30,60,.06)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:var(--bad);box-shadow:none}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--ink2);font-weight:600;min-height:40px;display:flex;align-items:center;justify-content:center;width:100%}
.card{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(20,30,60,.04)}
.list{background:#fff;border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;border-bottom:1px solid #F0F1F6;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .t{font-weight:650;font-size:15px}
.row .s{font-size:12.5px;color:var(--ink2);line-height:1.3}
.row .grow{flex:1;min-width:0}
.row .grow .t,.row .grow .s{overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:21px;object-fit:cover;background:#EDE7FB;flex-shrink:0}
.av.sm{width:34px;height:34px}
.av.stale{opacity:.5;filter:grayscale(.6)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pri)}
.ico img{width:30px;height:30px}
.ico svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--pale);color:var(--pri);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:#0B7A3B}.pill.warn{background:var(--warn-bg);color:#9A5800}.pill.bad{background:var(--bad-bg);color:#B42318}.pill.vio{background:#F1EBFE;color:#6D3FD8}.pill.gray{background:#EEF0F5;color:#4B5165}
.pill.live::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:999px;background:#fff;font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 1px 6px rgba(20,30,60,.08);min-height:36px}
.chip.on{background:var(--pri);color:#fff}
.chip img{width:20px;height:20px}
.seg{display:flex;background:#ECEEF5;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,30,60,.12)}
.tog{width:51px;height:31px;border-radius:16px;background:#D9DCE6;position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:left .2s}
.tog.on{background:#34C759}.tog.on::after{left:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:650;color:var(--ink2)}
.inp{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:17px;width:100%;color:var(--ink)}
.inp:focus{border-color:var(--pri);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.sec{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase;margin:6px 2px -4px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex-shrink:0}

/* bottom nav (V1 style) */
.nav{position:absolute;left:12px;right:12px;bottom:22px;display:flex;align-items:center;gap:8px;z-index:40}
.nav .rb{width:52px;height:52px;border-radius:26px}
.nav .bar{flex:1;height:58px;border-radius:29px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-around;box-shadow:0 6px 24px rgba(20,30,60,.14)}
.nav .bar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:#6B7084;min-width:54px;min-height:48px;justify-content:center;position:relative}
.nav .bar button svg{width:22px;height:22px}
.nav .bar button.on{color:var(--pri)}
.nav .me{width:52px;height:52px;border-radius:26px;background:#fff;box-shadow:0 6px 24px rgba(20,30,60,.14);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;position:relative}
.nav .me img{width:52px;height:52px;object-fit:cover}

/* sheets */
.sheetBack{position:absolute;inset:0;background:rgba(15,18,30,.35);z-index:60;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;max-height:calc(100% - 56px);animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -8px 30px rgba(20,30,60,.12)}
.sheet.full{max-height:100%;height:100%;border-radius:0}
.sheet .grab{width:100%;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:#D5D8E2}
.sheet .sbody{overflow-y:auto;padding:0 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.sheet .sbody::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

/* iOS system alert */
.sysBack{position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:800;display:flex;align-items:center;justify-content:center;animation:fade .15s}
.sys{width:272px;border-radius:14px;background:rgba(242,242,246,.97);backdrop-filter:blur(20px);text-align:center;overflow:hidden;animation:pop .2s;color:#000}
.sys .st{padding:18px 16px 14px;display:flex;flex-direction:column;gap:4px}
.sys .st b{font-size:17px;font-weight:600;line-height:1.25}
.sys .st span{font-size:13px;line-height:1.3}
.sys .sb{border-top:.5px solid rgba(60,60,67,.29);min-height:44px;color:#0A7AFF;font-size:17px;width:100%;display:flex;align-items:center;justify-content:center;padding:6px}
.sys .sb.b{font-weight:600}
.sys .mapPrev{height:110px;margin:0 16px 12px;border-radius:10px;background:url(a/bdf_fest.webp) 45% 50%/320% auto;position:relative}
.sys .mapPrev::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:7px;background:#0A7AFF;border:3px solid #fff;box-shadow:0 0 0 10px rgba(10,122,255,.2)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:900;background:rgba(28,31,42,.94);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;animation:pop .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast img{width:34px;height:34px;border-radius:17px;object-fit:cover}
.push{position:absolute;left:10px;right:10px;top:52px;z-index:900;background:rgba(245,245,248,.96);backdrop-filter:blur(20px);color:#000;border-radius:20px;padding:12px;display:flex;gap:10px;align-items:flex-start;animation:pop .25s;box-shadow:0 10px 30px rgba(0,0,0,.18);text-align:left;width:auto}
.push .pi{width:38px;height:38px;border-radius:9px;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.push .pi img{width:30px}
.push b{font-size:14px}.push span{font-size:13.5px;line-height:1.3}

/* Android (Material) */
.sys.android{border-radius:28px;background:#F3EDF7;text-align:left;width:300px;padding-bottom:10px}
.sys.android .st{padding:24px 24px 8px}.sys.android .st b{font-size:20px;font-weight:500;color:#1D1B20}.sys.android .st span{color:#49454F;font-size:14px}
.sys.android .sb{border:0;color:#6750A4;font-size:14px;font-weight:600;justify-content:flex-end;min-height:40px;padding:0 24px}
.sys.android .mapPrev{margin:4px 24px 10px}
.mk.me .fr .name{background:#4F6BF5;color:#fff}
.mk.me .fr .head{border-width:4px;box-shadow:0 0 0 5px rgba(79,107,245,.28),0 4px 12px rgba(20,30,60,.3)}
.cone{position:absolute;left:50%;top:22px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:46px solid rgba(79,107,245,.28);transform-origin:50% 100%;margin-left:-22px;margin-top:-46px;z-index:-1}
/* map */
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;background:linear-gradient(180deg,#BFD0F5,#EAD9F2 60%,#F8DDEB);cursor:grab}
.map.drag{cursor:grabbing}
.map .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.map .world img.base{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.map .ov{position:absolute;inset:0;pointer-events:none}
.map svg.ovs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .poi{width:46px;height:46px;border-radius:23px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(20,30,60,.25);border:2px solid #fff}
.mk .poi img{width:36px;height:36px}
.mk .lbl{margin-top:3px;background:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 2px 6px rgba(20,30,60,.18);color:var(--ink)}
.mk .lbl.warn{background:#FFF1DC;color:#9A5800}
.mk.clu .poi{background:var(--pri);color:#fff;font-weight:800;font-size:15px}
.mk .fr{position:relative;display:flex;flex-direction:column;align-items:center}
.mk .fr .name{background:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,60,.2);margin-bottom:3px;display:flex;gap:4px;align-items:center}
.mk .fr .head{width:46px;height:46px;border-radius:23px;border:3px solid #0E9F8A;background:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(20,30,60,.3)}
.mk .fr .head img{width:100%;height:100%;object-fit:cover}
.mk .fr .stem{width:3px;height:9px;background:#0E9F8A;border-radius:2px}
.mk.stale .fr .head{border-style:dashed;border-color:#8A8FA6;filter:grayscale(.5);opacity:.8}
.mk.stale .fr .stem{background:#8A8FA6}
.mk.me .fr .head{border-color:var(--pri);width:52px;height:52px;border-radius:26px}
.mk.me .fr .stem{background:var(--pri)}
.mk.staff .fr .head{border-color:#E58A00}
.mk.alert .poi{background:#E5484D;color:#fff;font-weight:900;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 18px rgba(229,72,77,0)}}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.mapTop{position:absolute;left:0;right:0;top:47px;z-index:20;display:flex;flex-direction:column;gap:8px;padding:4px 12px}
.evbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-radius:18px;padding:6px 6px 6px 8px;box-shadow:0 4px 16px rgba(20,30,60,.12)}
.evbar img.lg{width:34px;height:34px;border-radius:10px}
.ctrls{position:absolute;right:12px;top:186px;z-index:20;display:flex;flex-direction:column;gap:10px}
.ctrls .stack{background:rgba(255,255,255,.95);border-radius:24px;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(20,30,60,.14);overflow:hidden}
.ctrls .stack button{width:48px;height:46px;display:flex;align-items:center;justify-content:center}
.ctrls .stack button svg{width:21px;height:21px}
.ctrls .rb{width:48px;height:48px;border-radius:24px}
.livebar{position:absolute;left:12px;right:12px;bottom:92px;z-index:20;display:flex;flex-direction:column;gap:8px}
.mini{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(20,30,60,.14);text-align:left;width:100%}
.banner{position:absolute;left:12px;right:12px;z-index:25;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:650;display:flex;gap:8px;align-items:center}

/* avatar editor */
.avstage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}

V.otp = (num) => {

    <div class="body"><h1 class="h2">Code reçu par SMS</h1><p class="lead">Envoyé au ${esc(num)}</p>
    <div class="otp" id="otp">${'<span></span>'.repeat(6)}</div><button class="link" style="width:auto" id="rs">Renvoyer le code (0:24)</button></div>
    <div style="background:#D1D4DB;padding:6px 6px 0"><button class="suggest" id="sug" style="width:100%">${ST.os === 'android' ? 'Code détecté automatiquement' : 'Depuis Messages'} · <b>482 913</b></button></div>
    <div class="kp" id="kp" style="padding-top:6px">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => `<button class="${k === '' ? 'n' : ''}" data-k="${k}">${k}</button>`).join('')}</div>`, 'white');
  let done = false; const show = () => { $$('#otp span', el).forEach((s, i) => { s.textContent = code[i] || ''; s.classList.toggle('f', i === code.length); }); if (code.length === 6 && !done) { done = true; setTimeout(() => { ST.account = 'phone'; markStep('account'); V.profile(); }, 350); } };
  $('#kp', el).onclick = e => { const k = e.target.closest('button')?.dataset.k; if (k === undefined || k === '') return; code = k === '⌫' ? code.slice(0, -1) : (code + k).slice(0, 6); show(); };
  $('#sug', el).onclick = () => { code = '482913'; show(); }; $('#rs', el).onclick = () => toast('Nouveau code envoyé');
  $('[data-back]', el).onclick = V.phone; show();
};

const clouds = () => [[-40, 40, 220], [180, 10, 260], [60, 170, 200], [250, 220, 180], [-60, 300, 240]].map(([x, y, s]) => `<div class="cloud" style="left:${x}px;top:${y}px;width:${s}px;height:${s * .55}px"></div>`).join('');

// Éditeur d'avatar complet (structure du Figma : Corps / Habits / Accessoires)
V.avatarEditor = (onDone) => {
  let cat = 'body', sub = 'skin'; const prev = { ...ST.me };
  const SUBS = { body: [['skin', I.body, 'Peau'], ['hair', I.scissors, 'Coiffure'], ['face', I.smile, 'Visage']], clothes: [['top', I.shirt, 'Haut'], ['look', I.hanger, 'Tenue']], acc: [['glasses', I.glasses, 'Lunettes'], ['hat', I.hat, 'Chapeau'], ['jewel', I.ring, 'Bijoux']] };
  const zoomFor = () => ({ hair: 'scale(1.8)', face: 'scale(2)', glasses: 'scale(2)', hat: 'scale(1.8)', top: 'scale(1.3)', jewel: 'scale(1.3)' }[sub] || 'none');
  const originFor = () => ({ top: '50% 30%', jewel: '50% 40%' }[sub] || '50% 4%');
  const el = mount(`<div class="avstage" style="position:absolute;inset:0;align-items:flex-start;padding-top:150px">${clouds()}<div class="pedestal" id="ped" style="top:520px"></div><img class="avimg" id="big" src="${AVB(ST.me.base)}" alt="Ton avatar" style="height:390px;transform-origin:50% 0"></div>
    ${statusBar()}<div class="topbar" style="position:relative;z-index:6"><button class="rb" id="back" aria-label="Annuler">${I.back}</button><div style="flex:1;display:flex;justify-content:center"><div class="mini" style="width:auto;padding:6px 10px;font-size:12px;font-weight:650;gap:6px"><img src="${HEAD('rousse')}" style="width:22px;height:22px;border-radius:11px" alt="">Invite tes amis pour qu’ils aient eux aussi leur avatar !</div></div><button class="rb" id="ok" aria-label="Valider" style="color:var(--pri)">${I.check}</button></div>
    <div class="rail">${[['body', I.user, 'Corps'], ['clothes', I.hanger, 'Habits'], ['acc', I.glasses, 'Accessoires']].map(c => `<button data-c="${c[0]}" aria-label="${c[2]}">${c[1]}</button>`).join('')}<div style="height:20px"></div><button id="dice" aria-label="Au hasard">${I.dice}</button><button id="reset" aria-label="Réinitialiser">${I.reset}</button></div>
    <div style="flex:1"></div><div class="avpanel" id="avp" style="max-height:360px;overflow:auto"></div>`, 'sky');
  const big = $('#big', el), panel = $('#avp', el);
  const draw = () => {
    $$('.rail [data-c]', el).forEach(b => b.classList.toggle('on', b.dataset.c === cat));
    big.src = AVB(ST.me.base); big.style.transformOrigin = originFor(); big.style.transform = zoomFor();
    let content = '';
    if (sub === 'skin') content = `<div class="swatches">${SKIN.map((c, i) => `<button data-skin="${i}" class="${ST.me.skin === i ? 'on' : ''}" style="background:${c}" aria-label="Teinte ${i + 1}"></button>`).join('')}</div><div class="sec">Silhouettes avec cette teinte</div>`;
    if (['skin', 'hair', 'face', 'look'].includes(sub)) {
      let list = BASES; if (sub === 'skin') { list = BASES.filter(b => Math.abs(b.tone - ST.me.skin) <= 1); if (!list.length) list = BASES; }
      content += `<div class="items">${list.map(b => `<button class="base ${b.k === ST.me.base ? 'on' : ''}" data-b="${b.k}" style="aspect-ratio:${sub === 'hair' || sub === 'face' ? '1' : '.7'};background:linear-gradient(#EEF2FF,#fff)"><img src="${sub === 'hair' || sub === 'face' ? HEAD(b.k) : AVB(b.k)}" alt=""><span>${sub === 'hair' ? b.hair : sub === 'look' ? b.st : b.n}</span></button>`).join('')}</div>`;
    }
    if (sub === 'top') content = `<div class="swatches">${TOP_COLORS.map((c, i) => `<button data-tc="${i}" class="${ST.me.topColor === i ? 'on' : ''}" style="background:${c}" aria-label="Couleur ${i + 1}"></button>`).join('')}</div><div class="items">${TOPS.map(t => `<button data-top="${t.k}" class="${ST.me.top === t.k ? 'on' : ''}"><img src="${A}it/${t.k}.webp" alt="" style="filter:hue-rotate(${[0, 25, 50, 85, 180, 215, 260][ST.me.topColor]}deg)"><span>${t.n}</span></button>`).join('')}</div>`;
    if (sub === 'glasses') content = `<div class="items" style="grid-template-columns:repeat(3,1fr)"><button data-gl="" class="${!ST.me.glasses ? 'on' : ''}" style="aspect-ratio:1;align-items:center;font-weight:700;color:var(--ink2)">Aucune</button>${GLASSES.map(g => `<button data-gl="${g.k}" class="${ST.me.glasses === g.k ? 'on' : ''}" style="aspect-ratio:1"><img src="${A}it/${g.k}.webp" alt=""><span>${g.n}</span></button>`).join('')}</div>`;
    if (sub === 'hat' || sub === 'jewel') content = `<div class="card" style="text-align:center;align-items:center"><img src="${IC(sub === 'hat' ? 'merchandise' : 'sunglasses')}" alt="" style="width:64px"><b>${sub === 'hat' ? 'Chapeaux' : 'Bijoux'} : bientôt</b><span class="small">Les modèles 3D de cette catégorie seront livrés avec la V2 de l’éditeur.</span></div>`;
    const proto = ['top', 'glasses'].includes(sub) ? `<div class="small" style="text-align:center;background:#FFF7E8;border-radius:10px;padding:8px">Aperçu indisponible dans ce prototype : la pièce est enregistrée mais ne s’affiche pas encore sur l’avatar (moteur 3D de la V2).</div>` : '';
    panel.innerHTML = `<div class="subtabs">${SUBS[cat].map(s => `<button data-s="${s[0]}" class="${sub === s[0] ? 'on' : ''}" aria-label="${s[2]}">${s[1]}</button>`).join('')}</div>${content}${proto}`;
  };
  el.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.c) { cat = t.dataset.c; sub = SUBS[cat][0][0]; draw(); }
    else if (t.dataset.s) { sub = t.dataset.s; draw(); }
    else if (t.dataset.skin !== undefined) { ST.me.skin = +t.dataset.skin; const m = BASES.filter(b => Math.abs(b.tone - ST.me.skin) <= 1); if (m.length && !m.some(b => b.k === ST.me.base)) ST.me.base = m[0].k; draw(); }
    else if (t.dataset.b) { ST.me.base = t.dataset.b; draw(); }
    else if (t.dataset.tc !== undefined) { ST.me.topColor = +t.dataset.tc; draw(); }
    else if (t.dataset.top) { ST.me.top = t.dataset.top; draw(); }
    else if (t.dataset.gl !== undefined) { ST.me.glasses = t.dataset.gl || null; draw(); }
    else if (t.id === 'dice') { ST.me.base = BASES[Math.floor(Math.random() * BASES.length)].k; ST.me.topColor = Math.floor(Math.random() * 7); draw(); }
    else if (t.id === 'reset') { Object.assign(ST.me, { base: 'lins', skin: 1, top: null, glasses: null, topColor: 0 }); draw(); }
    else if (t.id === 'back') { Object.assign(ST.me, prev); onDone ? onDone() : V.settings(); }
    else if (t.id === 'ok') { emit(); if (!onDone) toast(`<img src="${meHead()}" alt="">Avatar enregistré`); onDone ? onDone() : V.settings(); }
  });
  draw();
};

V.replay = () => {
  const path = 'AB BC CD DE EF FG GH HI IH HG GF FM MN NO ON NM MF FE EQ QE ET TG GH HW WH HG GF FE ED DC CB BA'.split(' ').map(e => e[0]); path.push('A');
  const pts = path.map(k => NODES[k]); let L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + dist(pts[i - 1], pts[i]));
  const el = mount(`<div id="mv"></div>${statusBar()}<div class="mapTop"><div class="evbar"><button class="rb ghost" id="bk" aria-label="Retour">${I.back}</button><div style="flex:1"><b>Replay de ma soirée</b><div class="small"><span class="pill ok" style="padding:1px 7px">● REPLAY</span> ${EVENT.name}</div></div></div></div>
    <div style="position:absolute;right:12px;top:150px;z-index:20;display:flex;flex-direction:column;gap:6px;width:118px">${[['Heure', 'h'], ['Distance', 'd'], ['Pas', 's'], ['Zone', 'z']].map(s => `<div class="mini" style="flex-direction:column;align-items:flex-start;gap:0;padding:8px 10px"><span class="tiny">${s[0]}</span><b id="r${s[1]}" style="font-size:15px;font-variant-numeric:tabular-nums">—</b></div>`).join('')}</div>

  if (MV) MV.destroy();
  let k = 0, playing = false, speed = 1; const trail = [];
  MV = new MapView($('#mv', el), { at: [52, 55], zoom: .36, cluster: false, markers: () => { const at = posAt(k); return [...POIS.filter(o => ['scene', 'barO', 'barE', 'fosse', 'rotonde', 'entree'].includes(o.id)).map(o => ({ ...poiMarker(o, () => toast(`${o.n} : ${{ scene: '1 h 05', barO: '22 min', barE: '14 min', fosse: '2 h 12', rotonde: '37 min', entree: '6 min' }[o.id]} passés ici ce soir`)), z: 2 })), personMarker('me', 'Moi', meHead(), at, { me: true, acc: 3 })]; } });
  function posAt(k) { const d = k / 1000 * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const t = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]); return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; }
  const upd = () => { const at = posAt(k); const done = []; for (let j = 0; j <= 60; j++) { const kk = j / 60 * k; done.push(posAt(kk)); } MV.setRoute(done, '#8B5CF6');
    $('#rh', el).textContent = fmtClock(22 * 60 + 41 + k / 1000 * 317); $('#rd', el).textContent = (k / 1000 * 3.4).toFixed(1).replace('.', ',') + ' km'; $('#rs', el).textContent = Math.round(k / 1000 * 4620).toLocaleString('fr-FR'); $('#rz', el).textContent = zoneOf(at); $('#sl', el).value = k; };
  const tk = dt => { if (!document.body.contains(el)) { tickers.delete(tk); return; } if (playing) { k = Math.min(1000, k + dt * 40 * speed); if (k >= 1000) playing = false; upd(); $('#pp', el).innerHTML = playing ? I.pause : I.play; } };
  tickers.add(tk);

    <div class="row4"><div class="kpi" style="${r > .9 ? 'background:#FDECEC' : ''}"><span>Jauge réglementaire</span><b style="color:${r > .9 ? '#E5484D' : r > .75 ? '#E58A00' : '#16A34A'}">${fmtN(p)} / ${CLUB.legal}</b><small>${Math.round(r * 100)} % · alerte automatique à 90 %</small></div><div class="kpi"><span>Entrées ce soir</span><b>${fmtN(p + 186)}</b><small>scanner porte · relevé ${fmtClock(ST.clock)}</small></div><div class="kpi"><span>Tables réservées occupées</span><b>21 / 26</b></div><div class="kpi"><span>File vestiaire</span><b>≈ 6 min</b></div></div>
    <div class="cols"><div class="dcard" style="padding:0;overflow:hidden"><div class="dmap" id="cm" style="height:480px;background:#fff"></div></div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0"><div class="dcard"><h3>Porte : entrées et sorties par quart d’heure</h3><svg viewBox="0 0 320 120" style="width:100%">${q.map((x, i) => `<rect x="${i * 20 + 2}" y="${100 - x.e * 2}" width="8" height="${x.e * 2}" fill="#4F6BF5" rx="2"/><rect x="${i * 20 + 10}" y="${100 - x.s * 2}" width="8" height="${x.s * 2}" fill="#E58A00" rx="2"/>`).join('')}<text x="0" y="116" font-size="9" fill="#6B7084">23:00</text><text x="140" y="116" font-size="9" fill="#6B7084">01:00</text><text x="280" y="116" font-size="9" fill="#6B7084">03:00</text></svg><div class="tiny"><span class="dot" style="background:#4F6BF5"></span> entrées · <span class="dot" style="background:#E58A00"></span> sorties</div></div>
      <div class="dcard"><h3>Par espace</h3>${CLUB.zones.map(z => { const o = Math.round(z.cap * Math.min(.97, r * z.w * 1.1)); return `<div style="display:flex;flex-direction:column;gap:3px"><span style="display:flex;justify-content:space-between;font-size:13px"><span>${z.n}</span><b>${o} / ${z.cap}</b></span><span class="bar"><i style="width:${o / z.cap * 100}%;background:${o / z.cap > .85 ? '#E5484D' : '#22C55E'}"></i></span></div>`; }).join('')}</div></div></div>
    <div class="note">Logique club : la même carte sert toutes les semaines. Chaque soirée est comparée automatiquement à la précédente (menu « Semaine N-1 »). Deux niveaux : le casino et le club sont séparés, une personne au casino n’apparaît jamais dans le club.</div>`;
  DMV = new MapView($('#cm', c), { src: A + 'bisous.webp', w: 1200, h: 800, at: [52, 48], zoom: .5, cluster: false, maxS: 1.6, markers: () => CLUB.zones.map(z => { const o = Math.round(z.cap * Math.min(.97, r * z.w * 1.1)); return { id: 'cz' + z.id, at: z.at, html: `<div class="lbl" style="font-size:12px">● ${z.n} · ${Math.round(o / z.cap * 100)} %</div>`, halo: { m: 30, c: o / z.cap > .85 ? '#E5484D' : '#F59E0B' }, onClick: () => dToast(`<b>${z.n}</b> · ${o} / ${z.cap} personnes · temps moyen ${['42', '58', '12', '26', '4'][CLUB.zones.indexOf(z)]} min`), z: 3 }; }) });
};
Dv.clubcmp = (c) => {
  c.innerHTML = `<h1>Semaine N-1</h1><p class="sub">Samedi soir vs samedi précédent, à la même heure</p>
    <div class="row4"><div class="kpi"><span>Entrées à ${fmtClock(ST.clock)}</span><b>${fmtN(clubPresent() + 186)} <small style="color:#0B7A3B">+12 %</small></b></div><div class="kpi"><span>Pic de jauge</span><b>91 % <small style="color:#B42318">+4 pts</small></b><small>à 01:40 la semaine dernière</small></div><div class="kpi"><span>Temps moyen</span><b>2 h 48 <small style="color:#0B7A3B">+9 min</small></b></div><div class="kpi"><span>Incidents</span><b>3 <small style="color:#0B7A3B">−2</small></b></div></div>
    <div class="dcard"><h3>Tendance sur 8 semaines (entrées par soirée)</h3><svg viewBox="0 0 400 140" style="width:100%">${[612, 655, 590, 702, 688, 731, 745, 836].map((v, i) => `<rect x="${i * 48 + 10}" y="${130 - v / 7}" width="30" height="${v / 7}" rx="4" fill="${i === 7 ? '#4F6BF5' : '#C9D3FB'}"/><text x="${i * 48 + 25}" y="${124 - v / 7}" font-size="10" text-anchor="middle" fill="#1C1F2A">${v}</text>`).join('')}</svg></div>`;
};

// ===== Coque : téléphone + panneau de démonstration =====
function boot() {
  const dk = document.createElement('div'); dk.id = 'desk'; document.body.append(dk); dk.outerHTML = `<div id="desk"><div id="phoneWrap"><div id="phone"><div id="screen"><div class="island"></div><button id="fab-panel" aria-label="Panneau de démo">☰</button></div></div></div><aside id="panel"></aside></div>`;
  SCREEN = $('#screen'); fitPhone(); addEventListener('resize', fitPhone);
  $('#fab-panel').onclick = () => { const m = document.createElement('div'); m.id = 'mobileMenu'; m.innerHTML = `<div class="msheet">${panelHTML()}</div>`; m.onclick = e => { if (e.target === m) m.remove(); }; SCREEN.append(m); wirePanel(m); };
  wirePanel($('#panel')); renderPanel(); listeners.add(renderPanelLight);
  V.camera();
}
function fitPhone() {
  const ph = $('#phone'); if (!ph) return; if (innerWidth <= 820) { ph.style.transform = ''; ph.parentElement.style.width = ph.parentElement.style.height = ''; return; }
  const k = Math.min(1, (innerHeight - 24) / 844); ph.style.transform = `scale(${k})`; ph.parentElement.style.width = 390 * k + 'px'; ph.parentElement.style.height = 844 * k + 'px'; ph.style.transformOrigin = '0 0';
}
function panelHTML() {
  const m = ST.metrics, done = m.steps.map, t = done ? m.steps.map.t : m.start ? (performance.now() - m.start) / 1000 : 0;
  return `<section class="pcard"><h2>Défi : de l’entrée à la carte en moins de 2 min</h2>
      <div class="chrono ${done ? (t <= 120 ? 'ok' : 'late') : ''}"><b id="chr">${fmtT(t)}</b><span>${m.taps} touches</span></div>
      <div class="steps">${STEP_NAMES.map(([k, n]) => `<div class="${m.steps[k] ? 'done' : ''}"><span>${m.steps[k] ? '✓' : '○'} ${n}</span><span>${m.steps[k] ? fmtT(m.steps[k].t) : ''}</span></div>`).join('')}</div>
      <p>${done ? (t <= 120 ? 'Objectif atteint dans le prototype.' : 'Au-delà de 2 min : regarde quelle étape a pris le plus de temps.') : 'Lance le parcours et joue le visiteur.'}</p>${done ? `<p><b>En conditions réelles ≈ ${fmtT(t + 25)}</b> : ouverture de l’App Clip sur réseau chargé (+5 à 10 s), saisie réelle du pseudo (+5 s), réponse des amis au lien de bande (+10 s). À confirmer par un test terrain avec de vrais téléphones.</p>` : ''}
      <div class="pbtns"><button class="pbtn" data-p="restart">Recommencer depuis le QR</button><button class="pbtn" data-p="skip">Passer à la carte</button></div></section>
    <section class="pcard"><h2>Téléphone</h2><div class="pbtns">${[['ios', 'iPhone'], ['android', 'Android']].map(o => `<button class="pbtn ${ST.os === o[0] ? 'on' : ''}" data-p="os:${o[0]}">${o[1]}</button>`).join('')}</div><p>Fenêtres d’autorisation, connexion et App Clip / Instant App propres à chaque système.</p></section>
    <section class="pcard"><h2>Voir l’app en tant que</h2><div class="pbtns">${[['visitor', 'Visiteur'], ['staff', 'Agent sécurité'], ['bar', 'Barman'], ['dash', 'Organisateur (web)']].map(r => `<button class="pbtn ${ST.role === r[0] ? 'on' : ''}" data-p="role:${r[0]}">${r[1]}</button>`).join('')}</div>
      <p>Toutes les vues partagent les mêmes données : un signalement envoyé par le visiteur arrive chez l’agent et l’organisateur ; une rupture déclarée au bar s’affiche dans la carte des boissons.</p></section>
    <section class="pcard"><h2>Simuler</h2><div class="pbtns">
      <button class="pbtn" data-p="msg">Message de Léa</button><button class="pbtn" data-p="near">Ami arrivé</button><button class="pbtn" data-p="orga">Annonce de l’organisateur</button>
      <button class="pbtn ${ST.offline ? 'on' : ''}" data-p="offline">Pas de réseau</button><button class="pbtn" data-p="recap">Fin de soirée (récap)</button><button class="pbtn" data-p="guest">Mode invité</button><button class="pbtn" data-p="lock">Écran verrouillé</button><button class="pbtn" data-p="find">Chercher Léa (boussole)</button></div></section>
    <section class="pcard"><h2>Journal en direct</h2><div class="logline">${ST.log.slice(-30).map(l => `<span>${esc(l)}</span>`).join('') || '<span>Les actions des 3 vues s’affichent ici.</span>'}</div></section>
    <section class="pcard"><p>Prototype de démonstration : données fictives, installation, connexions Apple/Google et SMS simulées. Plan, avatars et icônes : visuels ONEERA existants.</p></section>`;
}
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function renderPanel() { const p = $('#panel'); if (!p) return; const lg = p.querySelector('.logline'), sc = lg ? lg.scrollTop : 0; p.innerHTML = panelHTML(); const l2 = p.querySelector('.logline'); if (l2) l2.scrollTop = sc; }
let lastPanel = 0;
function renderPanelLight() { const now = performance.now(); if (now - lastPanel < 250) return; lastPanel = now; renderPanel(); }
setInterval(() => { const c = $('#chr'); if (c && ST.metrics.start && !ST.metrics.steps.map) c.textContent = fmtT((performance.now() - ST.metrics.start) / 1000); }, 250);
function wirePanel(root) {
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return; const p = b.dataset.p; $('#mobileMenu')?.remove();
    if (p === 'restart') { resetDemo(); V.camera(); }
    if (p === 'skip') { quickSetup(); V.map(); }
    if (p.startsWith('role:')) { const r = p.slice(5); if (r === 'dash') { openDash('global'); renderPanel(); return; } ST.role = r; $('#dash') && closeDash(); if (r === 'visitor') { if (!ST.account) quickSetup(); V.map(); flushPush(); } else { S.map(); flushPush(); } }
    if (p === 'msg') { ensureVisitor(); ST.convos.lea.push({ me: 0, t: 'Je suis au bar à cocktails, tu viens ? 🍹' }); ST.unread.by.lea = (ST.unread.by.lea || 0) + 1; push({ title: 'Léa', text: 'Je suis au bar à cocktails, tu viens ? 🍹', icon: HEAD('rousse'), onTap: () => V.chat('lea') }); }
    if (p === 'near') { ensureVisitor(); if (!ST.friends.includes('yanis')) ST.friends.push('yanis'); push({ title: 'Yanis est arrivé', text: 'Il est à la Rotonde, à 120 m de toi.', icon: HEAD('metisse'), onTap: () => V.friendSheet('yanis') }); }
    if (p === 'orga') { ensureVisitor(); push({ title: 'Le Bal des Fous', text: 'Le bar Est est le plus rapide en ce moment (≈ 3 min).', app: 'ONEERA · Le Bal des Fous', onTap: () => V.poiSheet('barE') }); }
    if (p === 'offline') { ST.offline = !ST.offline; logEv(ST.offline ? 'Réseau perdu' : 'Réseau revenu'); if (!ST.offline) flushOffline(); emit(); if (ST.role === 'visitor' && MV && document.body.contains(MV.host) && $('#screen .nav')) V.map({ at: MV.centerPct(), zoom: MV.s }); else toast(ST.offline ? 'Réseau coupé' : 'Réseau revenu'); }
    if (p === 'recap') { ensureVisitor(); push({ title: 'Merci pour cette soirée ✨', text: 'Ton récap du Bal des Fous est prêt : 5 h 17, 3,4 km.', onTap: V.recap }); setTimeout(V.recap, 1200); }
    if (p === 'guest') { resetDemo(); ST.account = 'guest'; V.map(); }
    if (p.startsWith('os:')) { ST.os = p.slice(3); toast(ST.os === 'android' ? 'Mode Android' : 'Mode iPhone'); }
    if (p === 'lock') { ensureVisitor(); V.lock(); }
    if (p === 'find') { ensureVisitor(); V.findFriend('lea'); }
    renderPanel();
  });
}
function ensureVisitor() { if (ST.role !== 'visitor') { ST.role = 'visitor'; if (!ST.account) quickSetup(); V.map(); } $('#dash') && closeDash(); flushPush(); }
function quickSetup() { if (!ST.account || ST.account === 'guest') { ST.account = 'apple'; ST.me.pseudo = 'alex.m'; Object.assign(ST.perms, { loc: 'app', bt: true, notif: true, motion: true, contacts: 'full' }); ST.friends = ['lea', 'ines', 'tom', 'sami']; } }
const INIT = { st: JSON.parse(JSON.stringify(ST)), staff: JSON.parse(JSON.stringify(STAFF)) };
function resetDemo() {
  const keepLog = ST.log; Object.keys(ST).forEach(k => delete ST[k]); Object.assign(ST, JSON.parse(JSON.stringify(INIT.st)), { log: keepLog, pushQueue: [] });
  STAFF.forEach((s, i) => Object.assign(s, INIT.staff[i], { revoked: false })); D.reassort = []; D.commUsed = 2; D.pendingPush = []; D.crisis = false;
  if (walking) { tickers.delete(walking); walking = null; } if (MV) { MV.destroy(); MV = null; } clearTimeout(V._alwaysT); mapFilter = 'all'; showCrowd = false; nightMap = false;
   ST.account = null; ST.friends = []; ST.sent = []; ST.rdv = null; ST.role = 'visitor'; ST.offline = false; ST._askedAlways = 0; ST.me.pos = [50, 63]; Object.assign(ST.perms, { loc: null, always: false, bt: null, notif: null, motion: null, contacts: null, stats: false }); ST.metrics = { taps: 0, start: null, steps: {} }; $('#dash') && closeDash(); }
boot();
